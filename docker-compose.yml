version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # MongoDB 7.0 (Geospatial 2dsphere Data Store)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: oxima-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: oxima_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - oxima-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7.0 (Spatial GEO Indexing & 3-Hour City Surge Cache)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: oxima-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - oxima-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Apache Zookeeper (Kafka Coordination)
  # ----------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: oxima-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - oxima-network

  # ----------------------------------------------------------------------------
  # Apache Kafka (High-Throughput Telemetry Event Bus)
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: oxima-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - oxima-network

  # ----------------------------------------------------------------------------
  # Oxima Full-Stack Application (Multi-Stage Node.js + Vite Client)
  # ----------------------------------------------------------------------------
  oxima-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oxima-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/oxima_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: oxima_super_secure_production_jwt_secret_key_2026
      JWT_EXPIRES_IN: 7d
    networks:
      - oxima-network

networks:
  oxima-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
